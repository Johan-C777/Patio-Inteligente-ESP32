<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Patio Inteligente</title>
<style>
  :root {
    --bg-deep: #0a1310;
    --bg-panel: rgba(22, 36, 31, 0.72);
    --bg-panel-solid: #16241f;
    --bg-panel-2: #1c2f28;
    --accent-lantern: #f2a65a;
    --accent-lantern-dim: #c98a49;
    --accent-leaf: #7fb88f;
    --accent-dusk: #6c8ebf;
    --text-primary: #edefe9;
    --text-muted: #8fa398;
    --border-soft: rgba(237, 239, 233, 0.09);
    --border-strong: rgba(237, 239, 233, 0.18);
    --danger: #d9705a;
    --ok: #7fb88f;
    --mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg-deep);
    color: var(--text-primary);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  body {
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(242, 166, 90, 0.10), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 10%, rgba(108, 142, 191, 0.10), transparent 55%),
      radial-gradient(ellipse 1000px 700px at 50% 120%, rgba(127, 184, 143, 0.08), transparent 60%),
      var(--bg-deep);
  }

  .app {
    height: 100vh;
    height: 100dvh;
    max-width: 1180px;
    margin: 0 auto;
    padding: clamp(8px, 1.6vh, 16px) clamp(10px, 2vw, 20px);
    display: flex;
    flex-direction: column;
    gap: clamp(6px, 1.1vh, 12px);
    overflow-y: auto;
  }

  button { font: inherit; color: inherit; }

  /* ---------- Encabezado ---------- */
  .barra-superior {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: clamp(8px, 1.4vh, 14px) clamp(12px, 2vw, 20px);
    background: var(--bg-panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border-soft);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 6px 18px rgba(0, 0, 0, 0.28);
    border-radius: var(--radius);
  }

  .marca { display: flex; align-items: baseline; gap: 10px; min-width: 0; }

  .marca h1 {
    margin: 0;
    font-size: clamp(1rem, 2.6vw, 1.4rem);
    letter-spacing: 0.05em;
    font-weight: 800;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .marca .subtitulo {
    font-family: var(--mono);
    font-size: clamp(0.6rem, 1.3vw, 0.74rem);
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .estado-conexion {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: clamp(0.62rem, 1.4vw, 0.78rem);
    padding: 6px 12px;
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid var(--border-soft);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .punto-luz {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--danger);
    flex-shrink: 0;
  }

  .punto-luz.conectado {
    background: var(--accent-lantern);
    animation: pulso-lantern 2.2s ease-in-out infinite;
  }

  @keyframes pulso-lantern {
    0%   { box-shadow: 0 0 0 0 rgba(242, 166, 90, 0.55); }
    70%  { box-shadow: 0 0 0 8px rgba(242, 166, 90, 0); }
    100% { box-shadow: 0 0 0 0 rgba(242, 166, 90, 0); }
  }

  /* ---------- Tablero de tarjetas ---------- */
  .tablero {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-auto-rows: 1fr;
    gap: clamp(6px, 1vw, 12px);
  }
  .tablero .tarjeta:nth-child(5) { grid-column: 1 / -1; }

  @media (min-width: 760px) {
    .tablero {
      grid-template-columns: repeat(5, 1fr);
      grid-auto-rows: minmax(150px, 340px);
      align-content: center;
    }
    .tablero .tarjeta:nth-child(5) { grid-column: auto; }
  }

  .tarjeta {
    position: relative;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--bg-panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border-soft);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 6px 18px rgba(0, 0, 0, 0.28);
    border-radius: var(--radius);
    padding: clamp(7px, 1.3vh, 12px) clamp(8px, 1.3vw, 12px);
  }

  .cabecera-tarjeta {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px;
    margin-bottom: 2px;
  }
  .cabecera-tarjeta h2 {
    margin: 0;
    font-size: clamp(0.68rem, 1.6vw, 0.86rem);
    font-weight: 700;
    letter-spacing: 0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cabecera-tarjeta .gpio {
    font-family: var(--mono);
    font-size: clamp(0.5rem, 1.1vw, 0.6rem);
    color: var(--accent-leaf);
    opacity: 0.75;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .visual {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2px 0;
  }
  .visual svg { width: 100%; height: 100%; max-height: 100%; overflow: visible; }

  .lectura {
    flex: 0 0 auto;
    text-align: center;
    font-family: var(--mono);
    font-size: clamp(0.6rem, 1.3vw, 0.72rem);
    color: var(--text-muted);
    margin: 0 0 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .lectura b { color: var(--text-primary); font-weight: 600; }

  .controles {
    flex: 0 0 auto;
    display: flex;
    gap: 5px;
  }

  button.btn-mini {
    appearance: none;
    border: 1px solid var(--border-soft);
    background: var(--bg-panel-2);
    cursor: pointer;
    flex: 1 1 0;
    min-width: 0;
    padding: clamp(5px, 1vh, 8px) 2px;
    border-radius: var(--radius-sm);
    font-size: clamp(0.6rem, 1.3vw, 0.74rem);
    font-weight: 600;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
  }
  button.btn-mini:hover { border-color: var(--accent-leaf); }
  button.btn-mini:active { transform: scale(0.94); }
  button.btn-mini.activo {
    background: rgba(127, 184, 143, 0.18);
    border-color: var(--accent-leaf);
    color: var(--accent-leaf);
  }
  button.btn-mini.peligro:hover { border-color: var(--danger); }

  /* Franja de colores RGB (swatches redondos) */
  .fila-colores {
    flex: 0 0 auto;
    display: flex;
    justify-content: space-between;
    gap: 4px;
    padding: 0 2px;
  }
  button.punto-color {
    appearance: none;
    cursor: pointer;
    width: clamp(16px, 4vw, 24px);
    height: clamp(16px, 4vw, 24px);
    border-radius: 50%;
    background: var(--color, #444);
    border: 2px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 0 0 0 rgba(255,255,255,0);
    transition: transform 0.12s ease, box-shadow 0.15s ease;
    flex-shrink: 0;
  }
  button.punto-color:hover { transform: scale(1.15); }
  button.punto-color:active { transform: scale(0.9); }
  button.punto-color.activo { box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.45); }
  button.punto-color.off { background: #33403a; }
  button.punto-color.off::after {
    content: "";
    display: block;
    width: 100%; height: 2px;
    background: rgba(255,255,255,0.55);
    transform: translateY(-1px) rotate(-40deg);
  }

  /* ---------- LED (bombillo RGB) ---------- */
  .led-bombillo {
    width: min(58%, 64px);
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 28%, rgba(255,255,255,0.55), transparent 42%),
      var(--led-color, #33403a);
    box-shadow:
      0 0 0 5px rgba(255,255,255,0.04),
      0 0 18px 2px color-mix(in srgb, var(--led-color, #33403a) 65%, transparent);
    transition: background 0.5s ease, box-shadow 0.5s ease;
  }
  .tarjeta[data-modo-fiesta="true"] .led-bombillo {
    animation: parpadeo-fiesta 0.5s ease-in-out infinite alternate;
  }
  @keyframes parpadeo-fiesta {
    from { filter: brightness(1); }
    to   { filter: brightness(1.35); }
  }

  /* ---------- Puerta ---------- */
  .hoja-puerta { transform-origin: 22px 78px; transition: transform 0.7s cubic-bezier(.4,0,.2,1); }
  .tarjeta[data-estado="abierta"] .hoja-puerta { transform: rotate(-72deg); }
  .tarjeta[data-estado="cerrada"] .hoja-puerta { transform: rotate(0deg); }

  /* ---------- Silla ---------- */
  .grupo-silla { transform-origin: 50px 55px; transition: transform 0.6s cubic-bezier(.4,0,.2,1); }
  .tarjeta[data-estado="izquierda"] .grupo-silla { transform: rotate(-38deg); }
  .tarjeta[data-estado="centro"] .grupo-silla { transform: rotate(0deg); }
  .tarjeta[data-estado="derecha"] .grupo-silla { transform: rotate(38deg); }

  /* ---------- Fuente ---------- */
  .gota-fuente { opacity: 0; }
  .tarjeta[data-estado="true"][data-subsistema="fuente"] .gota-fuente {
    animation: chorro-fuente 1.3s ease-in-out infinite;
  }
  .gota-fuente.g2 { animation-delay: 0.2s !important; }
  .gota-fuente.g3 { animation-delay: 0.4s !important; }
  @keyframes chorro-fuente {
    0%   { transform: translateY(0); opacity: 0; }
    15%  { opacity: 1; }
    55%  { transform: translateY(-30px); opacity: 1; }
    85%  { opacity: 0.4; }
    100% { transform: translateY(6px); opacity: 0; }
  }
  .ondas-fuente { opacity: 0; transition: opacity 0.4s ease; }
  .tarjeta[data-estado="true"][data-subsistema="fuente"] .ondas-fuente { opacity: 1; }

  /* ---------- Regadera ---------- */
  .gota-riego { opacity: 0; }
  .tarjeta[data-estado="true"][data-subsistema="riego"] .gota-riego {
    animation: caer-riego 0.9s linear infinite;
  }
  .gota-riego.r2 { animation-delay: 0.25s !important; }
  .gota-riego.r3 { animation-delay: 0.5s !important; }
  @keyframes caer-riego {
    0%   { transform: translateY(0); opacity: 0; }
    20%  { opacity: 1; }
    90%  { opacity: 0.6; }
    100% { transform: translateY(22px); opacity: 0; }
  }
  .barra-riego {
    position: absolute;
    left: 10px; right: 10px; bottom: 4px;
    height: 3px;
    border-radius: 3px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
  }
  .barra-riego.visible { opacity: 1; }
  .barra-riego .relleno {
    height: 100%; width: 100%;
    background: var(--accent-dusk);
    transform-origin: left;
  }
  .barra-riego.animar .relleno { animation: vaciar-riego 5s linear forwards; }
  @keyframes vaciar-riego { from { transform: scaleX(1); } to { transform: scaleX(0); } }

  /* ---------- Franja de escenas ---------- */
  .franja-escenas {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: clamp(5px, 1vw, 10px);
    padding: clamp(6px, 1vh, 10px) clamp(10px, 1.6vw, 16px);
    background: linear-gradient(135deg, rgba(242, 166, 90, 0.08), var(--bg-panel) 60%);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(242, 166, 90, 0.22);
    border-radius: var(--radius);
  }
  .franja-escenas .rotulo {
    font-family: var(--mono);
    font-size: clamp(0.56rem, 1.2vw, 0.66rem);
    color: var(--accent-lantern);
    letter-spacing: 0.06em;
    flex-shrink: 0;
    white-space: nowrap;
  }
  .fila-escenas { display: flex; gap: clamp(5px, 1vw, 8px); flex: 1 1 auto; min-width: 0; }
  button.btn-escena {
    appearance: none;
    cursor: pointer;
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: clamp(6px, 1.3vh, 10px) 4px;
    border-radius: var(--radius-sm);
    border: 1px solid rgba(242, 166, 90, 0.28);
    background: rgba(242, 166, 90, 0.06);
    font-size: clamp(0.62rem, 1.5vw, 0.82rem);
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  button.btn-escena:hover { background: rgba(242, 166, 90, 0.16); }
  button.btn-escena:active { transform: scale(0.95); }
  button.btn-escena.activo {
    background: rgba(242, 166, 90, 0.24);
    border-color: var(--accent-lantern);
  }
  button.btn-escena .txt { overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Franja de voz / consola ---------- */
  .franja-consola {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: clamp(5px, 1vh, 8px) clamp(10px, 1.6vw, 16px);
    background: var(--bg-panel);
    backdrop-filter: blur(10px);
    border: 1px solid var(--border-soft);
    border-radius: var(--radius);
    min-height: 0;
  }

  button#btn-mic {
    width: clamp(34px, 6vh, 46px);
    height: clamp(34px, 6vh, 46px);
    border-radius: 50%;
    border: 2px solid var(--accent-dusk);
    background: rgba(108, 142, 191, 0.12);
    font-size: clamp(0.9rem, 2.4vh, 1.25rem);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.1s ease, background 0.2s ease;
  }
  button#btn-mic:active { transform: scale(0.93); }
  button#btn-mic.escuchando {
    background: rgba(242, 166, 90, 0.2);
    border-color: var(--accent-lantern);
    animation: anillo-escucha 1.1s ease-in-out infinite;
  }
  @keyframes anillo-escucha {
    0%   { box-shadow: 0 0 0 0 rgba(242, 166, 90, 0.55); }
    70%  { box-shadow: 0 0 0 12px rgba(242, 166, 90, 0); }
    100% { box-shadow: 0 0 0 0 rgba(242, 166, 90, 0); }
  }
  button#btn-mic:disabled { opacity: 0.35; cursor: not-allowed; animation: none; }

  .consola-texto {
    flex: 1 1 auto;
    min-width: 0;
    font-family: var(--mono);
    font-size: clamp(0.6rem, 1.4vw, 0.76rem);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text-muted);
  }
  .consola-texto b { color: var(--text-primary); font-weight: 600; }
  .consola-texto .ok { color: var(--ok); }
  .consola-texto .error { color: var(--danger); }

  .consola-cruda {
    flex-shrink: 0;
    font-family: var(--mono);
    font-size: clamp(0.52rem, 1.1vw, 0.62rem);
    color: var(--text-muted);
    opacity: 0.55;
    max-width: 34vw;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    display: none;
  }
  @media (min-width: 760px) { .consola-cruda { display: block; } }

  @media (prefers-reduced-motion: reduce) {
    .punto-luz.conectado, button#btn-mic.escuchando, .barra-riego.animar .relleno,
    .gota-fuente, .gota-riego, .tarjeta[data-modo-fiesta="true"] .led-bombillo {
      animation: none !important;
    }
  }
</style>
</head>
<body>
<div class="app">

  <header class="barra-superior">
    <div class="marca">
      <h1>Patio Inteligente</h1>
      <span class="subtitulo">ESP32 &middot; <span id="ip-esp32">--</span></span>
    </div>
    <div class="estado-conexion">
      <span class="punto-luz" id="punto-conexion"></span>
      <span id="texto-conexion">sin respuesta ❌</span>
    </div>
  </header>

  <main class="tablero">

    <!-- PUERTA -->
    <section class="tarjeta" data-subsistema="puerta" data-estado="cerrada">
      <div class="cabecera-tarjeta"><h2>Puerta</h2><span class="gpio">GPIO13</span></div>
      <div class="visual">
        <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
          <line x1="10" y1="78" x2="90" y2="78" stroke="var(--border-strong)" stroke-width="3" stroke-linecap="round"/>
          <line x1="22" y1="78" x2="22" y2="22" stroke="var(--accent-leaf)" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
          <g class="hoja-puerta">
            <line x1="22" y1="78" x2="22" y2="22" stroke="var(--accent-lantern)" stroke-width="4" stroke-linecap="round"/>
          </g>
          <circle cx="22" cy="78" r="2.5" fill="var(--text-muted)"/>
        </svg>
      </div>
      <div class="lectura">Estado: <b id="txt-puerta">--</b></div>
      <div class="controles">
        <button class="btn-mini" data-comando="abrir puerta">Abrir</button>
        <button class="btn-mini" data-comando="cerrar puerta">Cerrar</button>
      </div>
    </section>

    <!-- SILLA -->
    <section class="tarjeta" data-subsistema="silla" data-estado="centro">
      <div class="cabecera-tarjeta"><h2>Silla</h2><span class="gpio">GPIO14</span></div>
      <div class="visual">
        <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
          <circle cx="50" cy="55" r="30" fill="none" stroke="var(--border-soft)" stroke-width="2" stroke-dasharray="3 5"/>
          <g class="grupo-silla">
            <rect x="34" y="38" width="32" height="26" rx="6" fill="var(--accent-leaf)" opacity="0.85"/>
            <rect x="34" y="24" width="32" height="12" rx="5" fill="var(--accent-leaf)"/>
            <line x1="50" y1="38" x2="50" y2="18" stroke="var(--accent-lantern)" stroke-width="3" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
      <div class="lectura">Posicion: <b id="txt-silla">--</b></div>
      <div class="controles">
        <button class="btn-mini" data-comando="silla izquierda">Izq</button>
        <button class="btn-mini" data-comando="silla centro">Centro</button>
        <button class="btn-mini" data-comando="silla derecha">Der</button>
      </div>
    </section>

    <!-- FUENTE -->
    <section class="tarjeta" data-subsistema="fuente" data-estado="false">
      <div class="cabecera-tarjeta"><h2>Fuente</h2><span class="gpio">GPIO25</span></div>
      <div class="visual">
        <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
          <ellipse class="ondas-fuente" cx="50" cy="80" rx="34" ry="7" fill="none" stroke="var(--accent-dusk)" stroke-width="1.5"/>
          <ellipse cx="50" cy="82" rx="30" ry="9" fill="var(--bg-panel-2)" stroke="var(--border-strong)" stroke-width="2"/>
          <ellipse cx="50" cy="80" rx="24" ry="6" fill="var(--accent-dusk)" opacity="0.55"/>
          <circle class="gota-fuente g1" cx="38" cy="66" r="3" fill="var(--accent-dusk)"/>
          <circle class="gota-fuente g2" cx="50" cy="66" r="3" fill="var(--accent-dusk)"/>
          <circle class="gota-fuente g3" cx="62" cy="66" r="3" fill="var(--accent-dusk)"/>
        </svg>
      </div>
      <div class="lectura">Estado: <b id="txt-fuente">--</b></div>
      <div class="controles">
        <button class="btn-mini" data-comando="encender fuente">On</button>
        <button class="btn-mini peligro" data-comando="apagar fuente">Off</button>
      </div>
    </section>

    <!-- REGADERA -->
    <section class="tarjeta" data-subsistema="riego" data-estado="false">
      <div class="cabecera-tarjeta"><h2>Regadera</h2><span class="gpio">GPIO26</span></div>
      <div class="visual">
        <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
          <rect x="40" y="10" width="20" height="9" rx="2" fill="var(--border-strong)"/>
          <line class="gota-riego r1" x1="34" y1="24" x2="32" y2="38" stroke="var(--accent-dusk)" stroke-width="2.5" stroke-linecap="round"/>
          <line class="gota-riego r2" x1="50" y1="24" x2="50" y2="38" stroke="var(--accent-dusk)" stroke-width="2.5" stroke-linecap="round"/>
          <line class="gota-riego r3" x1="66" y1="24" x2="68" y2="38" stroke="var(--accent-dusk)" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M50 88 C32 80,32 58,50 50 C68 58,68 80,50 88 Z" fill="var(--accent-leaf)" opacity="0.85"/>
          <rect x="42" y="86" width="16" height="10" rx="2" fill="var(--bg-panel-2)" stroke="var(--border-strong)" stroke-width="1.5"/>
        </svg>
      </div>
      <div class="lectura">Estado: <b id="txt-riego">--</b></div>
      <div class="controles">
        <button class="btn-mini" data-comando="regar">Regar</button>
        <button class="btn-mini peligro" data-comando="detener riego">Detener</button>
      </div>
      <div class="barra-riego" id="barra-riego"><div class="relleno"></div></div>
    </section>

    <!-- RGB -->
    <section class="tarjeta" data-subsistema="rgb" data-estado="apagado" data-modo-fiesta="false">
      <div class="cabecera-tarjeta"><h2>Iluminacion</h2><span class="gpio">GPIO 18&middot;19&middot;21</span></div>
      <div class="visual"><div class="led-bombillo" id="led-bombillo"></div></div>
      <div class="lectura">Color: <b id="txt-color">--</b></div>
      <div class="fila-colores">
        <button class="punto-color" style="--color:#ff3b30" data-comando="luz roja" aria-label="Luz roja"></button>
        <button class="punto-color" style="--color:#34c759" data-comando="luz verde" aria-label="Luz verde"></button>
        <button class="punto-color" style="--color:#0a84ff" data-comando="luz azul" aria-label="Luz azul"></button>
        <button class="punto-color" style="--color:#f5f5f5" data-comando="luz blanca" aria-label="Luz blanca"></button>
        <button class="punto-color" style="--color:#aa00ff" data-comando="luz morada" aria-label="Luz morada"></button>
        <button class="punto-color off" data-comando="apagar luces" aria-label="Apagar luces"></button>
      </div>
    </section>

  </main>

  <!-- ESCENAS -->
  <section class="franja-escenas">
    <span class="rotulo">ESCENAS</span>
    <div class="fila-escenas">
      <button class="btn-escena" data-comando="modo noche"><span>🌙</span><span class="txt">Noche</span></button>
      <button class="btn-escena" data-comando="modo relajacion"><span>🧘</span><span class="txt">Relax</span></button>
      <button class="btn-escena" data-comando="modo fiesta"><span>🎉</span><span class="txt">Fiesta</span></button>
      <button class="btn-escena" data-comando="modo salida"><span>🚪</span><span class="txt">Salida</span></button>
    </div>
  </section>

  <!-- VOZ / CONSOLA -->
  <section class="franja-consola">
    <button id="btn-mic" title="Hablar">🎙️</button>
    <div class="consola-texto" id="consola-texto">» Panel listo. Pulsa un control o el microfono.</div>
    <div class="consola-cruda" id="consola-cruda">--</div>
  </section>

</div>

<script>
(function () {
  "use strict";

  var API_COMANDO = "/api/command";
  var API_ESTADO = "/api/status";
  var INTERVALO_ESTADO_MS = 1500;

  var elPuntoConexion = document.getElementById("punto-conexion");
  var elTextoConexion = document.getElementById("texto-conexion");
  var elIp = document.getElementById("ip-esp32");
  var elConsolaTexto = document.getElementById("consola-texto");
  var elConsolaCruda = document.getElementById("consola-cruda");
  var elBarraRiego = document.getElementById("barra-riego");
  var elLed = document.getElementById("led-bombillo");

  var tarjetaPuerta = document.querySelector('[data-subsistema="puerta"]');
  var tarjetaSilla = document.querySelector('[data-subsistema="silla"]');
  var tarjetaFuente = document.querySelector('[data-subsistema="fuente"]');
  var tarjetaRiego = document.querySelector('[data-subsistema="riego"]');
  var tarjetaRgb = document.querySelector('[data-subsistema="rgb"]');

  var COLOR_HEX = {
    "rojo": "#ff3b30",
    "verde": "#34c759",
    "azul": "#0a84ff",
    "blanco": "#f5f5f5",
    "morado": "#aa00ff",
    "apagado": "#33403a",
    "azul tenue": "#274a72",
    "cian suave": "#2f7480"
  };

  function colorHexDesdeNombre(nombre) {
    var base = (nombre || "apagado").replace(/^fiesta-/, "");
    return COLOR_HEX[base] || "#33403a";
  }

  var riegoPrevio = false;

  // ------------------------------------------------------------
  // Aplica un objeto de estado (de /api/status o de la respuesta
  // inmediata de /api/command) a TODOS los visuales del tablero.
  // ------------------------------------------------------------
  function aplicarEstado(estado) {
    if (!estado) return;

    if ("puerta" in estado) {
      tarjetaPuerta.setAttribute("data-estado", estado.puerta);
      document.getElementById("txt-puerta").textContent = estado.puerta;
    }
    if ("silla" in estado) {
      tarjetaSilla.setAttribute("data-estado", estado.silla);
      document.getElementById("txt-silla").textContent = estado.silla;
    }
    if ("fuente" in estado) {
      tarjetaFuente.setAttribute("data-estado", estado.fuente ? "true" : "false");
      document.getElementById("txt-fuente").textContent = estado.fuente ? "encendida" : "apagada";
    }
    if ("riego" in estado) {
      tarjetaRiego.setAttribute("data-estado", estado.riego ? "true" : "false");
      document.getElementById("txt-riego").textContent = estado.riego ? "regando" : "apagado";
      if (estado.riego && !riegoPrevio) mostrarBarraRiego();
      if (!estado.riego) ocultarBarraRiego();
      riegoPrevio = !!estado.riego;
    }
    if ("color" in estado) {
      tarjetaRgb.setAttribute("data-estado", estado.color);
      document.getElementById("txt-color").textContent = estado.color;
      elLed.style.setProperty("--led-color", colorHexDesdeNombre(estado.color));
      var puntos = document.querySelectorAll(".punto-color");
      puntos.forEach(function (p) {
        var esApagar = p.classList.contains("off");
        var comandoColor = p.getAttribute("data-comando").replace("luz ", "");
        var mapaComando = { roja: "rojo", verde: "verde", azul: "azul", blanca: "blanco", morada: "morado" };
        var activo = esApagar ? estado.color === "apagado" : estado.color === mapaComando[comandoColor];
        p.classList.toggle("activo", !!activo);
      });
    }
    if ("modo" in estado) {
      tarjetaRgb.setAttribute("data-modo-fiesta", estado.modo === "fiesta" ? "true" : "false");
      document.querySelectorAll(".btn-escena").forEach(function (boton) {
        var comando = boton.getAttribute("data-comando");
        boton.classList.toggle("activo", comando === "modo " + estado.modo);
      });
    }

    elConsolaCruda.textContent = JSON.stringify(estado);
  }

  function mostrarBarraRiego() {
    elBarraRiego.classList.remove("animar");
    void elBarraRiego.offsetWidth;
    elBarraRiego.classList.add("visible", "animar");
    setTimeout(ocultarBarraRiego, 5200);
  }
  function ocultarBarraRiego() {
    elBarraRiego.classList.remove("visible", "animar");
  }

  // ------------------------------------------------------------
  // Envio de comandos (botones, swatches de color Y voz)
  // ------------------------------------------------------------
  function sendCommand(comando, origenIcono) {
    marcarBotonActivo(comando);
    elConsolaTexto.innerHTML = '» Enviando <b>' + comando + "</b>...";

    return fetch(API_COMANDO, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ command: comando })
    })
      .then(function (respuesta) { return respuesta.json(); })
      .then(function (datos) {
        var clase = datos.ok ? "ok" : "error";
        elConsolaTexto.innerHTML =
          "» " + (origenIcono || "🖱️") + " <b>" + comando + "</b> &mdash; " +
          '<span class="' + clase + '">' + escaparHtml(datos.message || "") + "</span>";
        marcarConectado();
        if (datos.estado) aplicarEstado(datos.estado);
        return datos;
      })
      .catch(function () {
        elConsolaTexto.innerHTML = '» <span class="error">No se pudo contactar al ESP32.</span>';
        marcarDesconectado();
      });
  }
  window.sendCommand = sendCommand;

  function marcarBotonActivo(comando) {
    document.querySelectorAll("[data-comando]").forEach(function (boton) {
      if (boton.classList.contains("punto-color") || boton.classList.contains("btn-escena")) return;
      boton.classList.toggle("activo", boton.getAttribute("data-comando") === comando);
    });
  }

  function escaparHtml(texto) {
    var div = document.createElement("div");
    div.textContent = texto;
    return div.innerHTML;
  }

  document.querySelectorAll("[data-comando]").forEach(function (boton) {
    boton.addEventListener("click", function () {
      sendCommand(boton.getAttribute("data-comando"));
    });
  });

  // ------------------------------------------------------------
  // Estado periodico
  // ------------------------------------------------------------
  function actualizarEstado() {
    fetch(API_ESTADO, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
      .then(function (datos) {
        marcarConectado();
        aplicarEstado(datos);
      })
      .catch(marcarDesconectado);
  }

  function marcarConectado() {
    elPuntoConexion.classList.add("conectado");
    elTextoConexion.textContent = "conectado ✅";
    elIp.textContent = location.host;
  }
  function marcarDesconectado() {
    elPuntoConexion.classList.remove("conectado");
    elTextoConexion.textContent = "sin respuesta ❌";
  }

  actualizarEstado();
  setInterval(actualizarEstado, INTERVALO_ESTADO_MS);

  // ============================================================
  // VOZ
  // ============================================================
  var btnMic = document.getElementById("btn-mic");
  var MotorReconocimiento = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!MotorReconocimiento) {
    btnMic.disabled = true;
    btnMic.title = "Voz no disponible en este navegador";
  } else {
    var reconocimiento = new MotorReconocimiento();
    reconocimiento.lang = "es-CO";
    reconocimiento.continuous = false;
    reconocimiento.interimResults = false;
    reconocimiento.maxAlternatives = 1;
    var escuchando = false;

    btnMic.addEventListener("click", function () {
      if (escuchando) { reconocimiento.stop(); return; }
      try { reconocimiento.start(); } catch (e) {}
    });

    reconocimiento.onstart = function () {
      escuchando = true;
      btnMic.classList.add("escuchando");
      elConsolaTexto.innerHTML = "» 🎙️ Escuchando...";
    };
    reconocimiento.onend = function () {
      escuchando = false;
      btnMic.classList.remove("escuchando");
    };
    reconocimiento.onerror = function (evento) {
      escuchando = false;
      btnMic.classList.remove("escuchando");
      elConsolaTexto.innerHTML = '» <span class="error">Error de voz (' + evento.error + ")</span>";
    };
    reconocimiento.onresult = function (evento) {
      var transcripcion = evento.results[0][0].transcript;
      var comando = interpretarComando(transcripcion);
      if (comando) {
        sendCommand(comando, "🎙️ \"" + transcripcion + "\" &rarr;");
      } else {
        elConsolaTexto.innerHTML = '» 🎙️ "' + escaparHtml(transcripcion) + '" &mdash; <span class="error">no reconocido</span>';
      }
    };
  }

  function normalizarTexto(texto) {
    return (texto || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, " ").trim();
  }
  function contiene(t, p) { return t.indexOf(p) !== -1; }

  function interpretarComando(fraseOriginal) {
    var t = normalizarTexto(fraseOriginal);

    if (contiene(t, "puerta")) {
      if (contiene(t, "abr")) return "abrir puerta";
      if (contiene(t, "cerr") || contiene(t, "cierr")) return "cerrar puerta";
    }
    if (contiene(t, "silla")) {
      if (contiene(t, "izquierda")) return "silla izquierda";
      if (contiene(t, "derecha")) return "silla derecha";
      if (contiene(t, "centro")) return "silla centro";
    }
    if (contiene(t, "fuente")) {
      if (contiene(t, "apag")) return "apagar fuente";
      if (contiene(t, "enciend") || contiene(t, "activ") || contiene(t, "prend")) return "encender fuente";
    }
    if (contiene(t, "riego") || contiene(t, "regadera") || contiene(t, "regar")) {
      if (contiene(t, "deten") || contiene(t, "para") || contiene(t, "apag")) return "detener riego";
      return "regar";
    }
    if (contiene(t, "luz") || contiene(t, "luces")) {
      if (contiene(t, "apag")) return "apagar luces";
      if (contiene(t, "roja") || contiene(t, "rojo")) return "luz roja";
      if (contiene(t, "verde")) return "luz verde";
      if (contiene(t, "azul")) return "luz azul";
      if (contiene(t, "blanca") || contiene(t, "blanco")) return "luz blanca";
      if (contiene(t, "morada") || contiene(t, "morado") || contiene(t, "purpura")) return "luz morada";
    }
    if (contiene(t, "modo")) {
      if (contiene(t, "noche")) return "modo noche";
      if (contiene(t, "relaj")) return "modo relajacion";
      if (contiene(t, "fiesta")) return "modo fiesta";
      if (contiene(t, "salida")) return "modo salida";
    }
    return null;
  }
})();
</script>
</body>
</html>
